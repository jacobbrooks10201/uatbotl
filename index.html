<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Uatbotl — 1200 BC</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='2' y='2' width='5' height='5' fill='%23e0474c'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%233d8bfd'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.ts"></script>
    <script>
      // This page is the source for the dev server and the build. Opened
      // straight from disk it cannot load its scripts, so point to the build.
      addEventListener('load', () => {
        const app = document.getElementById('app');
        if (app.childElementCount) return;
        app.innerHTML =
          '<div style="font:14px monospace;padding:24px;max-width:640px;line-height:1.5">' +
          '<p>This index.html is the source page; it only runs through <code>npm run dev</code>.</p>' +
          '<p>To play from a file, open <a href="dist/index.html">dist/index.html</a> ' +
          '(run <code>npm run build</code> to make it), or a dated copy in archive/.</p></div>';
      });
    </script>
  </body>
</html>
